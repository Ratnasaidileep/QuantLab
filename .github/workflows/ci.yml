name: QuantLab CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Python Engine Quality, Linting & Automated Tests
  # ============================================================================
  python-quality:
    name: Python Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Run Automated Pytest Suite
        run: pytest -v --tb=short

  # ============================================================================
  # Job 2: React Frontend Linting, TypeScript Verification & Production Build
  # ============================================================================
  frontend-quality:
    name: React Frontend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify TypeScript & Build Vite Production Bundle
        run: npm run build

  # ============================================================================
  # Job 3: Docker Container Build Verification
  # ============================================================================
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [python-quality, frontend-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: quantlab-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: quantlab-frontend:ci-test

      - name: Validate Docker Compose Configuration
        run: docker compose config
